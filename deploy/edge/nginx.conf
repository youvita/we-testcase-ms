# Mac mini edge reverse proxy — one public entry for many local apps.
#
# cloudflared (1 process) → http://127.0.0.1:8080 → nginx → apps with basePath
#
# Free trycloudflare (one hostname):
#   /cases/       → we-testcase  :3000  (Next basePath=/cases)
#   /securescan/  → SecureScan   :3001  (Next basePath=/securescan)
#
# Do NOT strip path prefixes — apps own those prefixes via basePath.
# Preserve Cloudflare's X-Forwarded-Proto=https so redirects do not become :8080.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # cloudflared → nginx is HTTP :8080; keep the public scheme/port from CF.
  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  # Public Cloudflare host must never advertise origin port 8080.
  map $host $edge_proto {
    ~*trycloudflare\.com$  https;
    ~*cfargotunnel\.com$   https;
    default                $fwd_proto;
  }

  map $host $edge_port {
    ~*trycloudflare\.com$  443;
    ~*cfargotunnel\.com$   443;
    default                "";
  }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Proto $edge_proto;
  proxy_set_header X-Forwarded-Port  $edge_port;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;
  proxy_read_timeout 3600s;
  # Never advertise nginx's listen port (8080) in redirects.
  port_in_redirect off;
  absolute_redirect off;
  # Strip accidental :8080 from upstream Location headers.
  proxy_redirect ~^(https?://[^/:]+):8080(/.*)$ $1$2;
  proxy_redirect http://$host:8080/ https://$host/;
  proxy_redirect http://$host:8080 https://$host;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream wetestcase {
    server host.docker.internal:3000;
    keepalive 8;
  }

  upstream securescan {
    server host.docker.internal:3001;
    keepalive 8;
  }

  server {
    listen 8080;
    server_name ~^(cases|app|wetestcase)\.;
    port_in_redirect off;
    absolute_redirect off;

    location / {
      proxy_pass http://wetestcase;
    }
  }

  server {
    listen 8080;
    server_name ~^(scan|securescan)\.;
    port_in_redirect off;
    absolute_redirect off;

    location / {
      proxy_pass http://securescan;
    }
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    port_in_redirect off;
    absolute_redirect off;

    location = / {
      try_files /index.html =404;
    }

    location = /healthz {
      default_type text/plain;
      return 200 'ok\n';
    }

    location /cases/ {
      proxy_pass http://wetestcase;
    }

    location = /cases {
      proxy_pass http://wetestcase;
    }

    location /securescan/ {
      proxy_pass http://securescan;
    }

    location = /securescan {
      proxy_pass http://securescan;
    }

    location /scan/ {
      return 302 /securescan;
    }

    location = /scan {
      return 302 /securescan;
    }
  }
}
