# App-local reverse proxy, between cloudflared and the Next.js app.
#
#   cloudflared → nginx :80 → app:3000
#
# It exists for one reason: Cloudflare percent-encodes ( ) [ ] in the
# /_next/static chunk paths that Next.js generates from route groups and
# dynamic segments, e.g.
#   /cases/_next/static/chunks/app/%28app%29/projects/%5BprojectId%5D/…js
# and Next.js 15 answers 404 when parentheses and brackets are both encoded in
# the same URL. The browser asks for `(app)` literal; Cloudflare normalizes it
# to %28app%29 in flight, so the app never sees a path it can match and whole
# pages fail with "Loading chunk … failed".
#
# $uri is already decoded, so `proxy_pass http://app$uri` hands the app the
# literal (app) and [projectId] back. That is the entire job of this file —
# it strips no prefixes and adds no routing of its own.
#
# The shared Mac mini edge did this incidentally; pointing the tunnel straight
# at app:3000 removed it, which is how the bug surfaced.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # cloudflared → nginx is plain HTTP; keep the public scheme Cloudflare saw so
  # the app's redirects stay https and never advertise this container's port.
  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  upstream app {
    server app:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    port_in_redirect off;
    absolute_redirect off;

    # Server Actions accept 10 MB (next.config.ts bodySizeLimit); nginx's 1 MB
    # default would 413 an upload before it ever reached the app.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Watch-live screencast frames stream for as long as a run takes.
    proxy_read_timeout 3600s;
    proxy_buffering off;

    location = /healthz {
      default_type text/plain;
      return 200 'ok\n';
    }

    # $uri, not $request_uri: decoded on purpose. See the note at the top.
    location / {
      proxy_pass http://app$uri$is_args$args;
    }
  }
}
