# docker-compose.yml at monorepo root — dev Postgres only.
# Host port 5434 avoids clashing with other stacks on this machine (5432/5433
# are already taken by unrelated projects' Postgres containers).
# App: apps/web — DATABASE_URL must use localhost:5434 (see apps/web/.env.example).

services:
  postgres:
    image: postgres:16-alpine
    container_name: wetestcase-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wetestcase
    ports:
      - "5434:5432"
    volumes:
      - wetestcase-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wetestcase"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Claude without an API key: the `claude` CLI behind the Messages API, run per request
  # on the subscription token of whoever asked (see scripts/claude-bridge.mjs). `npm run
  # dev` runs on the host, so in dev the port is published — on loopback only, because the
  # bridge itself authenticates nobody. apps/web/.env points CLAUDE_BRIDGE_URL here.
  claude-bridge:
    container_name: wetestcase-claude-bridge-dev
    build:
      context: .
      dockerfile: deploy/bridge.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"

  # The automation runner (apps/runner): claims queued runs from the app and
  # executes them with Playwright. Behind a profile because its image carries
  # browsers and is large:
  #
  #   docker compose --profile automation up -d runner
  #
  # It reaches `npm run dev` on the host through host.docker.internal. A
  # script that targets a site on this Mac must use that name too, not
  # localhost — inside the container, localhost is the container.
  runner:
    container_name: wetestcase-runner-dev
    profiles: ["automation"]
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    restart: unless-stopped
    environment:
      APP_URL: ${RUNNER_APP_URL:-http://host.docker.internal:3001}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-dev-runner-token}
      RUNNER_NAME: dev-runner
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  wetestcase-pgdata:
